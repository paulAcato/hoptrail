# Every check on a pull request, and on main once it is merged, in one
# workflow. Its jobs share nothing, so they run side by side.
#
# Plugin Check runs on the build the deploy would ship: dist/ is built first,
# and the exclusions keep the checked tree in step with .distignore.
# See: https://github.com/WordPress/plugin-check-action
name: Checks
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpcs:
    name: Run PHPCS inspection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: cs2pr
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpcs --report-full --report-checkstyle=./phpcs-report.xml
      - if: ${{ failure() }}
        run: cs2pr ./phpcs-report.xml

  phpstan:
    name: Run PHPStan inspection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  tests:
    name: Run the analysis tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - run: php tests/test-analysis.php

  frontend:
    name: Type-check, lint styles and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --fund=false
      - run: npm run lint:css
      - run: npm run build

  plugin-check:
    name: Run Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --fund=false
      - run: npm run build
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: "./"
          exclude-directories: ".github,.idea,.phpstan,.prd,.wordpress-org,bin,node_modules,tests,vendor"
          exclude-files: ".distignore,.editorconfig,.gitattributes,.gitignore,.nvmrc,.stylelintrc.json,composer.json,composer.lock,package.json,package-lock.json,phpcs.xml.dist,phpstan.neon,tsconfig.json,vite.config.ts"
