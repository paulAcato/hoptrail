# See: https://github.com/10up/action-wordpress-plugin-asset-update
#
# Pushes only the readme and the WordPress.org assets to SVN, between
# releases; the code itself goes out with a tag (deploy.yml).
#
# The action refuses to deploy whenever anything else in trunk differs from
# the repository, which is every push to main that has unreleased code on it,
# and dist/ is never in the checkout because it is built on release. So the
# job only runs when the readme or the assets changed, and IGNORE_OTHER_FILES
# has it push those while it leaves the rest of trunk to the next release.
#
# A push that changes the Stable tag is a release, not a readme fix. Sent
# ahead of the tag, that readme would point WordPress.org at a tag that is not
# in SVN yet, so it is left to deploy.yml, which sends the readme with the tag.
#
# Two jobs: "check" decides without secrets whether there is anything to send, so
# the wordpress-org environment (approval, SVN secrets) is only asked for when there is.
name: Plugin asset/readme update
on:
  push:
    branches:
      - main
    paths:
      - readme.txt
      - .wordpress-org/**

permissions:
  contents: read

jobs:
  check:
    name: Anything to send?
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Leave a release to the tag
        id: release
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git diff "$BEFORE" HEAD -- readme.txt | grep -qE '^[-+]Stable tag:'; then
            echo "The Stable tag changes, so the readme goes out with the tag."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          # WordPress.org creates the SVN repository once the plugin is approved; until then
          # there is nowhere to send the readme and assets to.
          status=$(curl -s -o /dev/null -w '%{http_code}' https://plugins.svn.wordpress.org/hoptrail/)
          if [ "$status" = "404" ]; then
            echo "::notice::The plugin is not on WordPress.org yet (SVN repository missing); nothing to update."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  trunk:
    name: Push to main
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment: wordpress-org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: WordPress.org plugin asset/readme update
        uses: 10up/action-wordpress-plugin-asset-update@2480306f6f693672726d08b5917ea114cb2825f7 # 2.2.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          IGNORE_OTHER_FILES: true
